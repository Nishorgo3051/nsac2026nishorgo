<title>Ingito · ইঙ্গিত</title>

<!--
  INGITO · ইঙ্গিত - a satellite instrument brought down to human scale.

  THE COMPOSITION IS THE IDENTITY. Read top to bottom, the screen is the flag of Bangladesh and
  the two points of view the instrument connects:

    ORBIT   The green band. What the satellite saw, said the way a satellite would say it: a key to
            the radar layer, and the pass itself as telemetry - platform, band, time.
    EARTH   The map. The real piece of Bangladesh - a Sentinel-2 photograph of Feni, its rivers,
            villages, roads and shelters - with the radar's flood water laid on it, hatched,
            because it is a measurement and not a painting.
    GROUND  The red bar. What the person standing there records. Human, immediate, and the largest
            things on the screen to touch.

  Two languages, both native. English and বাংলা are written separately, not translated word for
  word; the switch is always on screen. Bangla uses Bangla numerals and Bangladeshi usage (পানি).

  Light and dark change the instrument's surfaces only. The Earth, the radar and the meaning of
  every mark stay exactly the same in both.

  Rules kept from the field design:
    NO ANIMATION       nothing fades, slides or eases; every action leaves a visible state.
    ONE SCREEN         panels stop at 45% height, so the reticle and the readout stay visible.
    CONTRAST           every text pair measured with the WCAG formula: body text 15:1 or better,
                       dim text 7.6:1+, coloured text 7.3:1+, labels on the flag green 6.6:1,
                       report buttons 6.7:1 (bold 20 px).
    REM SIZES          the reader's own text-size setting is respected.

  Marks - each meaning carried by shape as well as colour:
    CYAN hatched area       flood water seen by radar from orbit (the only cyan on the map)
    RED circle / triangle   the operator's own report: water here / road cut
    RED ring, white core    the operator's position
    GREEN square, roof      shelter reference point (unverified)
    CREAM line, dark edge   road          CYAN dashes on a road   road crossing radar water
    PALE BLUE line          river, canal  WHITE dashes            upazila boundary
-->

  /* ================= EARTH - the map ================= */
  #stage { position: relative; overflow: hidden; background: #0d1712; }
  #map { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }

  /* The reticle: four white ticks around an open centre, so what is under it stays visible. */

  #reticle i:nth-child(4) { top: 22px; right: 0; width: 14px; height: 2px; }
  #reticle i:nth-child(5) { left: 21px; top: 21px; width: 4px; height: 4px; border-radius: 50%; }

  #ground { background: var(--paper); }

  }

  /* Narrow phones: the slot names become their icons alone (pin, drop, house - the same marks the

  <symbol id="i-orbit" viewBox="0 0 24 24"><circle cx="11" cy="12" r="4.2"/><ellipse cx="12" cy="12" rx="10" ry="3.8" transform="rotate(-22 12 12)"/><circle cx="20.3" cy="10.6" r="1.2" fill="currentColor"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3 2.5 8 12 13l9.5-5z"/><path d="M2.5 12.5 12 17.5l9.5-5"/><path d="M2.5 17 12 22l9.5-5"/></symbol>
  <symbol id="i-source" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><path d="M12 7.5v.01"/></symbol>
  <symbol id="i-reports" viewBox="0 0 24 24"><rect x="5" y="4.5" width="14" height="17" rx="2"/><path d="M9 3h6v3H9z"/><path d="M8.5 11h7M8.5 15h5"/></symbol>
  <symbol id="i-locate" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z"/></symbol>
  <!-- The mark: the flag's red disc, crossed by an orbit with its satellite. -->
  <symbol id="mark" viewBox="0 0 40 40">
    <ellipse cx="20" cy="20" rx="17" ry="6" transform="rotate(-22 20 20)" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="1.6"/>
    <circle cx="18" cy="20" r="10.5" fill="#f42a41"/>
    <path d="M3 20a17 6 0 0 0 34 0" transform="rotate(-22 20 20)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="34.2" cy="17.9" r="2.4" fill="#fff"/>
  </symbol>
</svg>

<div id="screen">
  <header id="orbit">
    <div class="bar">
      <span class="brand">
        <svg class="mark" aria-hidden="true"><use href="#mark"/></svg>
        <span class="word"><b>ইঙ্গিত</b><small>INGITO</small></span>
      </span>
      <span class="grow"></span>
      <div class="seg" id="lang" role="group" aria-label="Language / ভাষা">
        <button data-lang="en" aria-pressed="false" lang="en">EN</button>
        <button data-lang="bn" aria-pressed="false" lang="bn">বাংলা</button>
      </div>
      <button class="round" id="theme"><svg class="i" id="theme-icon"><use href="#i-moon"/></svg></button>
    </div>
    <p id="key" hidden><span class="swatch" id="key-swatch"></span><span id="key-text"></span></p>
    <p id="telemetry"><span id="tele"></span><span id="chip-net"></span></p>
  </header>

  <main id="stage">
    <canvas id="map"></canvas>
    <div id="reticle" hidden><i></i><i></i><i></i><i></i><i></i></div>
    <div id="compare" hidden><span class="pill" id="pill-before"></span><span class="pill" id="pill-during"></span></div>
    <div id="scale" hidden><span id="scale-text"></span><span id="scale-bar"></span></div>
    <div id="controls" hidden>
      <button class="mapbtn" id="lens" aria-pressed="false"><svg class="i"><use href="#i-orbit"/></svg><span id="lens-text"></span></button>
      <button class="mapbtn" id="zoom-in">+</button>
      <button class="mapbtn" id="zoom-out">&minus;</button>
    </div>
    <button id="hint" hidden></button>

    <div id="hud">
      <section id="readout" hidden>
        <div class="slot"><span class="k"><svg class="i"><use href="#i-pin"/></svg><span class="caps" data-t="where"></span></span>
          <span class="v" id="r-where"></span></div>
        <!-- Where the two points of view meet: what orbit saw, and what the ground says. -->
        <div class="slot"><span class="k"><svg class="i"><use href="#i-water"/></svg><span class="caps" data-t="water"></span></span>
          <span class="v persp"><span class="tag orbit" data-t="orbitTag"></span><span id="r-water"></span></span>
          <span class="sub persp"><span class="tag ground" data-t="groundTag"></span><span id="r-ground"></span></span></div>
        <div class="slot"><span class="k"><svg class="i"><use href="#i-shelter"/></svg><span class="caps" data-t="shelter"></span></span>
          <span class="v" id="r-shelter"></span></div>
      </section>
    </div>

    <div id="confirm" hidden>
      <span class="text" id="confirm-text"></span>
      <button id="confirm-undo" data-t="undo"></button>
    </div>

    <section class="panel" id="panel-layers" hidden></section>
    <section class="panel" id="panel-source" hidden></section>
    <section class="panel" id="panel-reports" hidden></section>

    <section id="gate">
      <div class="gate-inner">
        <svg class="gate-mark" aria-hidden="true"><use href="#mark"/></svg>
        <h1 data-t="gateTitle"></h1>
        <p class="sub" data-t="gateSub"></p>
        <div class="card" id="gate-card"><div class="line"><span data-t="looking"></span></div></div>
        <div id="progress"></div>
        <label class="file"><span data-t="openFile"></span>
          <input type="file" id="pack-file" accept=".json,application/json">
        </label>
      </div>
    </section>
  </main>

  <footer id="ground">
    <div id="reportbar">
      <button id="btn-water"><span class="top"><svg class="i"><use href="#i-water"/></svg><span class="lbl caps" data-t="waterHere"></span></span>
        <span class="n" id="n-water"></span></button>
      <button id="btn-road"><span class="top"><svg class="i"><use href="#i-road"/></svg><span class="lbl caps" data-t="roadCut"></span></span>
        <span class="n" id="n-road"></span></button>
    </div>
    <nav id="tools">
      <button id="tool-layers" aria-pressed="false"><svg class="i"><use href="#i-layers"/></svg><span class="caps" data-t="layers"></span></button>
      <button id="tool-source" aria-pressed="false"><svg class="i"><use href="#i-source"/></svg><span class="caps" data-t="source"></span></button>
      <button id="tool-reports" aria-pressed="false"><svg class="i"><use href="#i-reports"/></svg><span class="caps" data-t="reports"></span></button>
      <button id="tool-locate"><svg class="i"><use href="#i-locate"/></svg><span class="caps" data-t="locate"></span></button>
    </nav>
  </footer>
</div>

<!-- Only present in a published build: the pack inlined so the page needs no packs folder.
     Missing locally, which is harmless - the instrument then downloads or imports a pack file. -->
<script src="pack-embed.js"></script>
<script src="app.js"></script>
