<title>Ingito · ইঙ্গিত</title>

<!--
  INGITO · ইঙ্গিত - a satellite intelligence system brought down to human scale.

  THE MAP IS THE PRODUCT. Everything else is placed on top of the geography or directly under it:
  a thin brand bar, the Earth, one insight card, four ways in. On a wide screen the card and the
  panels move into a column beside the map; the map never becomes one box among many.

  FOUR LAYERS OF INFORMATION, and each one looks different on the map without a legend:
    EARTH    the real ground - a Sentinel-2 photograph of the district, rivers, roads, villages,
             shelters, upazila lines. Cream roads, pale-teal rivers, green shelter squares.
    SIGNAL   what the satellite measured - water seen by Sentinel-1 radar. Bright teal, HATCHED,
             because it is a measurement and not a painting.
    INSIGHT  what the signal means - roads that cross that water. RED DASHES.
    ACTION   what people do and record - "water here", "road cut". RED CIRCLE / TRIANGLE.

  RED MEANS ATTENTION, nothing else: a road through water, a person's report, a widespread-water
  alert. Everything else is river green, teal and delta cream. Red never carries a meaning alone:
  every red mark has its own shape, every alert its own word.

  Two native languages. English and বাংলা are written separately, not translated word for word;
  the switch is always on screen. Inter for Latin, Hind Siliguri for Bangla - both stored with the
  app, both under the Open Font License (fonts/).

  Light and dark change the surfaces only. The Earth, the radar and the meaning of every mark stay
  the same in both. Motion only explains: a sheet rising, the before/after line opening, the map
  gliding to a place you chose. With reduced motion requested, none of it runs.

  Contrast measured with the WCAG formula: body text 12:1 or better in both modes, dim text 6:1+,
  teal and red text 6.2:1+, report buttons 10.7:1 (light) and 8.2:1 (dark).
-->

<style>
  @font-face {

  }

      U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113,
      U+2C60-2C7F, U+A720-A7FF;
  }

    unicode-range: U+0951-0952, U+0964-0965, U+0980-09FE, U+1CD0, U+1CD2, U+1CD5-1CD6, U+1CD8,
      U+1CE1, U+1CEA, U+1CED, U+1CF2, U+1CF5-1CF7, U+200C-200D, U+20B9, U+25CC, U+A8F1;
  }
  @font-face {
    font-family: "Hind Siliguri"; font-style: normal; font-weight: 600; font-display: swap;
    src: url(fonts/hind-siliguri-bengali-600.woff2) format("woff2");
    unicode-range: U+0951-0952, U+0964-0965, U+0980-09FE, U+1CD0, U+1CD2, U+1CD5-1CD6, U+1CD8,
      U+1CE1, U+1CEA, U+1CED, U+1CF2, U+1CF5-1CF7, U+200C-200D, U+20B9, U+25CC, U+A8F1;

    src: url(fonts/hind-siliguri-bengali-700.woff2) format("woff2");
    unicode-range: U+0951-0952, U+0964-0965, U+0980-09FE, U+1CD0, U+1CD2, U+1CD5-1CD6, U+1CD8,
      U+1CE1, U+1CEA, U+1CED, U+1CF2, U+1CF5-1CF7, U+200C-200D, U+20B9, U+25CC, U+A8F1;
  }

  /* ================= tokens ================= */
  :root {
    /* The INGITO palette. Fixed: the same in light and dark. */
    --river-deep: #0b3d32;        /* primary surfaces, the brand bar, trusted ground */
    --river-green: #1e7d6b;       /* water as a place, active states */
    --floodplain: #a7c4b7;        /* land, secondary text on the brand bar */
    --delta-sand: #eae6d9;        /* reading surfaces, text on the brand bar */
    --sun-red: #e63946;           /* ATTENTION - marks and indicators only */
    --red-fill: #c8283a;          /* sun red deepened so white text on it reads at 5.5:1 */
    --signal: #5ee0cc;            /* what the radar measured: the map's water, its key */
    --map-ground: #0a2a22;        /* under the photograph, behind every map swatch */

    /* Surfaces and text, light mode: warm, never pure white. */
    --bg: #efebdf;
    --surface: #faf8f2;
    --surface-2: #eae6d9;
    --ink: #0a2b23;               /* 14.3:1 on surface */
    --dim: #3d5a51;               /*  7.1:1 */
    --line: #d6cfbd;
    --teal-ink: #12685a;          /*  6.3:1 */
    --red-ink: #b21f2c;           /*  6.3:1 */
    --action-bg: #0b3d32;
    --action-ink: #f4f1e6;        /* 10.7:1 */
    --e1: 0 1px 2px rgba(10, 30, 24, 0.18), 0 4px 14px rgba(10, 30, 24, 0.14);
    --e2: 0 -6px 22px rgba(4, 20, 16, 0.22);

    /* Rhythm */
    --s1: 0.25rem; --s2: 0.5rem; --s3: 0.75rem; --s4: 1rem; --s5: 1.5rem;
    --r-sm: 6px; --r-md: 10px; --r-lg: 16px; --r-pill: 999px;
    --tap: 2.75rem;               /* 44 px: the smallest thing a thumb is asked to hit */

    --font: "Inter", "Hind Siliguri", "Noto Sans Bengali", "Nirmala UI", system-ui, sans-serif;
    --mono: ui-monospace, "Cascadia Mono", Consolas, "Roboto Mono", monospace;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #041a15;
    --surface: #0a2f27;
    --surface-2: #0f3d33;
    --ink: #eeebe0;               /* 12.1:1 on surface */
    --dim: #a7c4b7;               /*  7.8:1 */
    --line: #1d4d41;
    --teal-ink: #6fd6c4;          /*  8.4:1 */
    --red-ink: #ff8a92;           /*  6.4:1 */
    --action-bg: #a7c4b7;
    --action-ink: #062a22;        /*  8.2:1 */
    --e1: 0 1px 2px rgba(0, 0, 0, 0.5), 0 4px 14px rgba(0, 0, 0, 0.4);
    --e2: 0 -6px 22px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }

  /* ================= base ================= */
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { font-size: 100%; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink); overflow: hidden;
    font: 400 1rem/1.4 var(--font); font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }
  html[lang="bn"] body { line-height: 1.5; }
  button, input { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; padding: 0; }
  :focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }
  svg.i { width: 1.25rem; height: 1.25rem; flex: none; fill: none; stroke: currentColor;
          stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .grow { flex: 1 1 auto; }
  /* Latin capitals get tracking; Bangla has no capitals, and spacing it apart breaks its joins. */
  .caps { text-transform: uppercase; letter-spacing: 0.1em; }
  html[lang="bn"] .caps { text-transform: none; letter-spacing: 0; }
  .dim { color: var(--dim); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @keyframes rise { from { transform: translateY(14px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  /* ================= components ================= */
  .btn {
    min-height: 3rem; padding: 0 var(--s4); border-radius: var(--r-md); border: 1.5px solid var(--ink);
    display: inline-flex; align-items: center; justify-content: center; gap: var(--s2);
    font-weight: 700; font-size: 0.98rem; text-decoration: none;
  }
  .btn.primary { background: var(--action-bg); border-color: var(--action-bg); color: var(--action-ink); }
  .btn.wide { width: 100%; margin-top: var(--s2); }
  .btn.danger { border-color: var(--red-ink); color: var(--red-ink); }
  .btn.danger.armed { background: var(--red-fill); border-color: var(--red-fill); color: #fff; }
  .btn.far { margin-top: 2rem; }          /* kept well away from Export: a slip must not delete */
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s2); margin-top: var(--s3); }
  .btns .btn { margin: 0; padding: 0 var(--s2); }

  .float { background: var(--surface); color: var(--ink); border: 1px solid var(--line); box-shadow: var(--e1); }
  .chip {
    display: inline-flex; align-items: center; gap: var(--s2); min-height: var(--tap); padding: 0 var(--s3);
    border-radius: var(--r-pill); font-size: 0.86rem; font-weight: 600; white-space: nowrap;
  }
  .mapbtn { width: var(--tap); height: var(--tap); border-radius: var(--r-md); display: grid; place-items: center; font-size: 1.5rem; }
  .mapbtn[aria-pressed="true"] { background: var(--action-bg); color: var(--action-ink); border-color: var(--action-bg); }

  /* The map's own marks, reused in the interface so a key never needs explaining twice. */
  .mk { display: inline-block; flex: none; }
  .mk.signal {
    width: 1.5rem; height: 0.95rem; border: 1.5px solid var(--signal); border-radius: 3px; background-color: var(--map-ground);
    background-image: repeating-linear-gradient(135deg, rgba(200, 252, 242, 0.95) 0 1.4px, rgba(94, 224, 204, 0.3) 1.4px 4.5px);
  }
  .mk.signal.radar { background-image: linear-gradient(90deg, #1b2b27, #d8efe9); }
  .mk.field { width: 0.8rem; height: 0.8rem; border-radius: 50%; background: var(--sun-red); box-shadow: 0 0 0 1.5px #fff, 0 0 0 2.5px var(--line); }

  .sec {
    margin: var(--s4) 0 var(--s1); font-size: 0.7rem; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--dim);
  }
  html[lang="bn"] .sec { font-size: 0.86rem; letter-spacing: 0; text-transform: none; }

  details { border-top: 1px solid var(--line); }
  details:last-of-type { border-bottom: 1px solid var(--line); }
  summary {
    min-height: 3rem; display: flex; align-items: center; gap: var(--s2); cursor: pointer; list-style: none;
    font-weight: 700; font-size: 0.95rem;
  }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "+"; margin-left: auto; font-size: 1.3rem; font-weight: 500; color: var(--dim); }
  details[open] summary::after { content: "\2212"; }
  details > :not(summary) { margin-top: 0; }
  details[open] { padding-bottom: var(--s3); }

  dl.meta { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 0.3rem 0.8rem; font-size: 0.9rem; }
  dl.meta dt { font-weight: 700; color: var(--dim); }
  dl.meta dd { margin: 0; overflow-wrap: anywhere; }
  .plain { font-size: 0.92rem; margin: var(--s2) 0; }
  .limit {
    border-left: 4px solid var(--signal); background: var(--surface-2); border-radius: var(--r-sm);
    padding: 0.6rem 0.7rem; margin: var(--s3) 0; font-size: 0.92rem;
  }

  /* ================= layout ================= */
  /* One column on a phone: brand bar, the Earth, the insight card, four ways in. */
  #screen {
    display: grid; height: 100%;
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto auto;
    grid-template-areas: "bar" "map" "sheet" "nav";
  }

  /* ================= the brand bar ================= */
  #bar { grid-area: bar; background: var(--river-deep); color: var(--delta-sand); padding: 0.4rem 0.75rem 0.45rem; }
  #bar .top { display: flex; align-items: center; gap: var(--s2); }
  .brand { display: flex; align-items: center; gap: 0.55rem; min-width: 0; }
  .logo { width: 2.3rem; height: 2.3rem; flex: none; }
  .word { display: grid; line-height: 1.1; }
  .word b { font-size: 0.9rem; font-weight: 700; letter-spacing: 0.32em; }
  .word span { font-size: 0.98rem; font-weight: 600; }
  .seg { display: flex; border: 1.5px solid rgba(234, 230, 217, 0.7); border-radius: var(--r-pill); overflow: hidden; }
  .seg button { min-width: 2.9rem; height: var(--tap); padding: 0 0.6rem; font-weight: 700; font-size: 0.92rem; }
  .seg button[aria-pressed="true"] { background: var(--delta-sand); color: var(--river-deep); }
  .round {
    width: var(--tap); height: var(--tap); border-radius: var(--r-pill); display: grid; place-items: center;
    border: 1.5px solid rgba(234, 230, 217, 0.7);
  }
  #status { display: flex; align-items: center; gap: var(--s2); margin: 0.3rem 0 0; min-height: 1.5rem; }
  #status svg.i { width: 1rem; height: 1rem; color: var(--signal); }
  #status:has(#tele:empty) svg.i { visibility: hidden; }     /* no pass to describe before a pack */
  #tele {
    flex: 1 1 auto; min-width: 0; font-size: 0.68rem; font-weight: 600; letter-spacing: 0.07em; color: var(--floodplain);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  html[lang="bn"] #tele { font-size: 0.8rem; letter-spacing: 0; }
  #chip-net {
    flex: none; font-size: 0.74rem; font-weight: 700; border-radius: var(--r-pill); padding: 0.1rem 0.55rem;
    border: 1.5px solid rgba(234, 230, 217, 0.75); white-space: nowrap;
  }
  /* Offline is the instrument's normal working state in the field: shown bright, not as an error. */
  #chip-net.lit { background: var(--delta-sand); color: var(--river-deep); }

  /* ================= the Earth ================= */
  #stage { grid-area: map; position: relative; overflow: hidden; background: var(--map-ground); min-height: 0; }
  #map { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }

  /* The reticle: four white ticks around an open centre, so what is under it stays visible. */
  #reticle { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; pointer-events: none; }
  #reticle i { position: absolute; background: #fff; box-shadow: 0 0 0 1.5px rgba(0, 0, 0, 0.6); border-radius: 1px; }
  #reticle i:nth-child(1) { left: 22px; top: 0; width: 2px; height: 14px; }
  #reticle i:nth-child(2) { left: 22px; bottom: 0; width: 2px; height: 14px; }
  #reticle i:nth-child(3) { top: 22px; left: 0; width: 14px; height: 2px; }
  #reticle i:nth-child(4) { top: 22px; right: 0; width: 14px; height: 2px; }
  #reticle i:nth-child(5) { left: 21px; top: 21px; width: 4px; height: 4px; border-radius: 50%; }

  #top { position: absolute; z-index: 2; top: var(--s2); left: var(--s2); right: var(--s2); display: grid; gap: 0.4rem; pointer-events: none; }
  #top > * { pointer-events: auto; }
  .line { display: flex; align-items: center; gap: 0.4rem; min-width: 0; }
  .line.split { justify-content: space-between; pointer-events: none; }
  .line.split > * { pointer-events: auto; }
  #search { flex: 1 1 auto; display: flex; align-items: center; gap: var(--s2); height: var(--tap); padding: 0 var(--s3); border-radius: var(--r-pill); min-width: 0; }
  #search svg.i { color: var(--dim); }
  #q { flex: 1 1 auto; min-width: 0; border: 0; background: none; outline: none; font-size: 1rem; }   /* 16 px: phones do not zoom in */
  #q::placeholder { color: var(--dim); opacity: 1; }
  #search:focus-within { outline: 3px solid var(--signal); outline-offset: 1px; }
  #results { list-style: none; margin: 0; padding: var(--s1); border-radius: var(--r-md); max-height: 50vh; overflow-y: auto; }
  #results button { display: flex; align-items: baseline; gap: var(--s2); width: 100%; min-height: var(--tap); padding: 0.3rem var(--s3); text-align: left; border-radius: var(--r-sm); }
  #results button:hover, #results button:focus-visible { background: var(--surface-2); }
  #results b { font-weight: 600; }
  #results small { margin-left: auto; font-size: 0.78rem; color: var(--dim); white-space: nowrap; }
  #results .none { padding: var(--s3); font-size: 0.9rem; color: var(--dim); }
  #key { min-height: 2.3rem; font-size: 0.8rem; }
  html[lang="bn"] #key { font-size: 0.9rem; }
  /* The before/after comparison is a core interaction: named in words, never behind a menu. */
  #lens { min-height: 2.3rem; font-weight: 700; font-size: 0.82rem; cursor: pointer; }
  html[lang="bn"] #lens { font-size: 0.92rem; }
  #lens[aria-pressed="true"] { background: var(--river-deep); color: var(--signal); border-color: var(--signal); }

  #controls { position: absolute; right: var(--s2); bottom: 1.3rem; display: grid; gap: 0.4rem; }
  #scale {
    position: absolute; left: var(--s2); bottom: 1.3rem; display: grid; gap: 0.1rem; padding: 0.2rem 0.5rem 0.3rem;
    border-radius: var(--r-sm); font-size: 0.72rem; font-weight: 700;
  }
  #scale-bar { height: 5px; border: 2px solid var(--ink); border-top: 0; }

  #compare { position: absolute; inset: 0; pointer-events: none; }
  .pill {
    position: absolute; padding: 0.2rem 0.6rem; border-radius: var(--r-pill); white-space: nowrap;
    font-size: 0.74rem; font-weight: 700; letter-spacing: 0.04em; background: var(--river-deep);
    color: var(--delta-sand); border: 1px solid var(--signal);
  }
  html[lang="bn"] .pill { font-size: 0.84rem; letter-spacing: 0; }

  /* A one-time invitation to the comparison, pointing at the button it explains. */
  #hint {
    position: absolute; right: var(--s2); top: 6.4rem; max-width: 14rem; text-align: left; border-radius: var(--r-md);
    border-top: 3px solid var(--signal); padding: 0.5rem 0.65rem; font-size: 0.86rem; font-weight: 600;
  }

  /* Right under the insight card's buttons: the answer appears where the thumb already is. */
  #confirm {
    position: absolute; left: var(--s2); right: 3.8rem; bottom: 1.3rem; display: flex; align-items: center; gap: 0.6rem;
    border-left: 5px solid var(--river-green); border-radius: var(--r-md); padding: 0.35rem 0.4rem 0.35rem 0.65rem;
    font-size: 0.95rem; font-weight: 700;
  }
  #confirm .text { flex: 1 1 auto; cursor: pointer; }
  #confirm .text small { display: block; font-weight: 500; color: var(--dim); font-size: 0.8rem; }
  #confirm button { min-width: 4.8rem; height: 3rem; border-radius: var(--r-sm); border: 1.5px solid var(--ink); font-weight: 700; }

  /* ================= the insight card ================= */
  /* It overlaps the map by a few pixels: a card placed on the geography, not a box beside it. */
  #sheet {
    grid-area: sheet; position: relative; z-index: 3; margin-top: -0.8rem; padding: 0.6rem 0.75rem 0.65rem;
    background: var(--surface); border-radius: var(--r-lg) var(--r-lg) 0 0; box-shadow: var(--e2);
  }
  .earth { display: flex; align-items: flex-start; gap: var(--s2); width: 100%; text-align: left; border-radius: var(--r-sm); }
  .earth > svg.i { margin-top: 0.15rem; color: var(--dim); }
  .earth .txt { flex: 1 1 auto; min-width: 0; }
  #r-place { display: block; font-weight: 700; font-size: 1.02rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #r-coords { display: block; font-size: 0.78rem; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  html[lang="bn"] #r-coords { font-size: 0.85rem; }
  .earth .go { align-self: center; color: var(--dim); }
  .persp { display: grid; grid-template-columns: 6.4rem 1fr; align-items: baseline; column-gap: var(--s2); margin-top: 0.35rem; font-size: 0.95rem; }
  .tag { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.64rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); }
  html[lang="bn"] .tag { font-size: 0.8rem; letter-spacing: 0; text-transform: none; }
  #r-water { font-weight: 600; }
  #r-water.hit { color: var(--teal-ink); font-weight: 700; }
  #r-ground { color: var(--dim); }
  #r-ground.near { color: var(--red-ink); font-weight: 600; }
  .shelter { display: flex; align-items: flex-start; gap: var(--s2); margin-top: 0.35rem; font-size: 0.9rem; }
  .shelter svg.i { width: 1.1rem; height: 1.1rem; color: var(--river-green); margin-top: 0.1rem; }
  #r-shelter small { display: block; font-size: 0.76rem; color: var(--dim); }
  html[lang="bn"] #r-shelter small { font-size: 0.84rem; }

  #actions { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s2); margin-top: 0.55rem; }
  .act {
    min-height: 3.5rem; padding: 0.35rem 0.75rem; border-radius: var(--r-md); background: var(--action-bg); color: var(--action-ink);
    display: grid; grid-template-columns: auto 1fr; align-items: center; column-gap: 0.55rem; text-align: left;
  }
  .act svg.i { grid-row: span 2; width: 1.5rem; height: 1.5rem; stroke-width: 2.2; }
  .act .lbl { font-size: 1.05rem; font-weight: 700; line-height: 1.15; }
  html[lang="bn"] .act .lbl { font-size: 1.15rem; }
  .act .n { font-size: 0.76rem; font-weight: 500; opacity: 0.88; }

  /* ================= four ways in ================= */
  #nav { grid-area: nav; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  #nav button {
    position: relative; height: 3.4rem; display: grid; place-content: center; justify-items: center; gap: 0.1rem;
    font-size: 0.72rem; font-weight: 600; color: var(--dim);
  }
  html[lang="bn"] #nav button { font-size: 0.86rem; }
  #nav button[aria-pressed="true"] { color: var(--teal-ink); }
  #nav button[aria-pressed="true"]::before { content: ""; position: absolute; top: 0; left: 25%; right: 25%; height: 3px; border-radius: 0 0 3px 3px; background: var(--river-green); }
  #nav .badge {
    position: absolute; top: 0.35rem; left: calc(50% + 0.45rem); min-width: 1.15rem; height: 1.15rem; padding: 0 0.25rem;
    border-radius: var(--r-pill); background: var(--sun-red); color: #fff; font-size: 0.66rem; font-weight: 700; line-height: 1.15rem; text-align: center;
  }

  /* ================= sheets ================= */
  /* A sheet rises over the lower part of the map; the top of the map stays in view. */
  .panel {
    grid-area: map; align-self: end; z-index: 4; max-height: 64%; overflow-y: auto; overscroll-behavior: contain;
    background: var(--surface); color: var(--ink); border-radius: var(--r-lg) var(--r-lg) 0 0; box-shadow: var(--e2);
    padding: 0 0.9rem 1.2rem; animation: rise 0.18s ease-out;
  }
  /* With a sheet open, the insight card keeps only its two buttons, and the map gets the room. */
  #screen.panelled .insight { display: none; }
  #screen.panelled #sheet { margin-top: 0; box-shadow: none; border-top: 1px solid var(--line); border-radius: 0; }
  #screen.panelled #confirm, #screen.panelled #hint { display: none; }
  .ph { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: var(--s2); padding: 0.7rem 0 0.45rem; background: var(--surface); }
  .ph h2 { flex: 1 1 auto; margin: 0; font-size: 1.1rem; font-weight: 700; line-height: 1.25; }
  .x { width: var(--tap); height: var(--tap); border-radius: var(--r-pill); display: grid; place-items: center; margin-right: -0.5rem; }
  .lead { margin: 0 0 var(--s2); font-size: 0.92rem; color: var(--dim); }

  /* Layers */
  .group { margin: var(--s4) 0 var(--s2); font-size: 0.68rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
  html[lang="bn"] .group { font-size: 0.86rem; letter-spacing: 0; text-transform: none; }
  .lrow { display: flex; align-items: center; gap: var(--s3); width: 100%; min-height: 3.4rem; padding: 0.3rem 0; text-align: left; border-bottom: 1px solid var(--line); }
  .lrow .txt { flex: 1 1 auto; min-width: 0; }
  .lrow b { display: block; font-size: 0.96rem; font-weight: 600; }
  .lrow small { display: block; font-size: 0.78rem; color: var(--dim); }
  html[lang="bn"] .lrow small { font-size: 0.86rem; }
  .lrow .icon { flex: none; border-radius: var(--r-sm); }
  .switch { position: relative; flex: none; width: 2.7rem; height: 1.6rem; border-radius: var(--r-pill); background: var(--line); transition: background 0.15s; }
  .switch::after {
    content: ""; position: absolute; top: 0.2rem; left: 0.2rem; width: 1.2rem; height: 1.2rem; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.35); transition: transform 0.15s;
  }
  .lrow[aria-checked="true"] .switch { background: var(--river-green); }
  .lrow[aria-checked="true"] .switch::after { transform: translateX(1.1rem); }
  .lrow[aria-checked="false"] b { color: var(--dim); }

  /* Alerts: what happened, where, when, why it matters, what to do. Red marks only the word and
     the bar of a widespread alert - never a whole card. */
  .alert { border: 1px solid var(--line); border-radius: var(--r-md); padding: 0.75rem 0.8rem 0.8rem; margin-top: var(--s2); background: var(--surface); }
  .sev { display: flex; align-items: center; gap: var(--s2); font-size: 0.68rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); }
  html[lang="bn"] .sev { font-size: 0.84rem; letter-spacing: 0; text-transform: none; }
  .sev .bar { width: 1.7rem; height: 0.4rem; border-radius: var(--r-pill); background: var(--river-green); }
  .sev .level { color: var(--teal-ink); }
  .alert.wide .sev .bar { background: var(--sun-red); }
  .alert.wide .sev .level { color: var(--red-ink); }
  .alert.little .sev .bar { background: none; box-shadow: inset 0 0 0 1.5px var(--dim); }
  .alert.little .sev .level { color: var(--dim); }
  .alert h3 { margin: 0.35rem 0 0.1rem; font-size: 1.12rem; line-height: 1.25; }
  .alert .where, .alert .when { margin: 0; font-size: 0.82rem; color: var(--dim); }
  html[lang="bn"] .alert .where, html[lang="bn"] .alert .when { font-size: 0.9rem; }
  .alert .why { margin: var(--s2) 0; font-size: 0.95rem; }
  .basis { display: flex; align-items: center; gap: 0.4rem; margin: 0 0 var(--s2); font-size: 0.78rem; color: var(--dim); }
  html[lang="bn"] .basis { font-size: 0.86rem; }
  .alert .btn { min-height: var(--tap); }

  /* The area brief */
  .overview { margin: var(--s1) 0 var(--s2); font-size: 1.1rem; font-weight: 600; line-height: 1.4; }
  .thumbs { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s2); margin-top: var(--s2); }
  .thumbs figure { margin: 0; }
  .thumbs canvas { display: block; width: 100%; border-radius: var(--r-sm); background: var(--map-ground); }
  .thumbs figcaption { margin-top: 0.2rem; font-size: 0.78rem; font-weight: 600; color: var(--dim); }
  ul.facts { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.35rem; font-size: 0.92rem; }
  ul.facts li { display: flex; gap: var(--s2); align-items: flex-start; }
  ul.facts svg.i { width: 1.05rem; height: 1.05rem; margin-top: 0.15rem; color: var(--dim); }

  /* Reports */
  ul.reports { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.4rem; }
  ul.reports li { display: flex; gap: 0.6rem; align-items: center; border: 1px solid var(--line); border-radius: var(--r-md); padding: 0.45rem 0.45rem 0.45rem 0.65rem; font-size: 0.92rem; }
  ul.reports .body { flex: 1 1 auto; min-width: 0; }
  ul.reports .kind { font-weight: 700; color: var(--red-ink); }
  ul.reports .when { color: var(--dim); font-size: 0.8rem; }
  ul.reports button { flex: none; min-width: 4.8rem; height: 3rem; border-radius: var(--r-sm); border: 1.5px solid var(--ink); font-weight: 700; font-size: 0.9rem; }
  .sync { display: flex; gap: var(--s2); align-items: flex-start; margin: var(--s3) 0; padding: 0.6rem 0.7rem; border-radius: var(--r-sm); background: var(--surface-2); font-size: 0.9rem; }
  textarea {
    width: 100%; height: 7rem; margin-top: var(--s2); padding: 0.45rem; border: 1px solid var(--line); border-radius: var(--r-sm);
    font: 0.72rem/1.3 var(--mono); background: var(--surface-2); color: var(--ink);
  }

  /* ================= first run ================= */
  #gate { grid-row: 2 / -1; grid-column: 1 / -1; z-index: 10; overflow-y: auto; padding: 1.8rem 1.1rem; background: var(--river-deep); color: var(--delta-sand); }
  .gate-inner { max-width: 30rem; margin: 0 auto; }
  .gate-logo { width: 5rem; height: 5rem; display: block; }
  .gate-word { display: grid; margin: var(--s3) 0 0; line-height: 1.15; }
  .gate-word b { font-size: 1.05rem; letter-spacing: 0.34em; }
  .gate-word span { font-size: 1.15rem; font-weight: 600; }
  #gate h1 { margin: var(--s5) 0 0.35rem; font-size: 1.6rem; font-weight: 700; line-height: 1.2; color: #faf8f2; }
  #gate .sub { margin: 0 0 var(--s4); font-size: 1rem; color: var(--floodplain); }
  #gate .card { border-radius: var(--r-lg); padding: 0.9rem; background: var(--surface); color: var(--ink); }
  #gate .row { display: flex; justify-content: space-between; gap: 0.6rem; font-size: 0.95rem; padding: 0.12rem 0; }
  #progress { margin-top: 0.6rem; font-size: 1rem; font-weight: 700; min-height: 1.5em; }
  #gate label.file { display: block; margin-top: var(--s4); font-size: 0.95rem; font-weight: 600; }
  #gate input[type=file] { display: block; margin-top: 0.4rem; font-size: 0.95rem; width: 100%; }
  /* Packs: the area as one row of choices, and the exact size pinned to the bottom of the sheet. */
  .pills { display: flex; flex-wrap: wrap; gap: var(--s2); }
  .pills button { min-height: var(--tap); padding: 0 var(--s3); border-radius: var(--r-pill); border: 1.5px solid var(--line); font-weight: 600; font-size: 0.9rem; }
  .pills button[aria-pressed="true"] { background: var(--action-bg); border-color: var(--action-bg); color: var(--action-ink); }
  .lrow[aria-disabled="true"] { cursor: default; }
  .cutbar {
    position: sticky; bottom: -1.2rem; display: flex; align-items: center; justify-content: space-between; gap: var(--s3);
    margin: var(--s4) -0.9rem -1.2rem; padding: 0.6rem 0.9rem; background: var(--surface); border-top: 1px solid var(--line); font-weight: 700;
  }
  .cutbar span { white-space: nowrap; }
  .cutbar .btn { flex: 1 1 auto; }

  /* The map's label. Red only for the one line that needs attention: conditions may have changed. */
  #label h1 { margin-top: 0; }                /* the brand is already in the bar above */
  #label dl.meta { gap: 0.55rem 0.9rem; font-size: 0.95rem; }
  #label dd small { display: block; font-size: 0.82rem; color: var(--dim); }
  #label .warn { display: block; color: var(--red-ink); font-weight: 700; }
  #label .code { font-family: var(--mono); font-size: 1.15rem; letter-spacing: 0.08em; }
  /* Pinned to the bottom of the screen while the label scrolls, so a small phone never hides it. */
  #label .btn { margin-top: var(--s4); position: sticky; bottom: 0.5rem; box-shadow: var(--e1); }

  /* ================= smaller and shorter phones ================= */
  /* Narrow phones: the card's two labels become their marks alone - the same hatched swatch and red
     dot the map uses - so every answer gets the width to sit on one line. The words stay readable
     to a screen reader. */
  @media (max-width: 360px) {
    .word b { letter-spacing: 0.24em; }
    #key .txt { max-width: 9.5rem; overflow: hidden; text-overflow: ellipsis; }
    .persp { grid-template-columns: 1.7rem 1fr; }
    .persp .tag > span:not(.mk) { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  }
  /* Short phones: the map keeps the room. The key steps aside (the card's satellite line carries
     the same mark), Before / After moves right, the map buttons tighten - still 40 px - so the
     column never meets the row above it or the reticle. */
  @media (max-height: 680px) {
    #sheet { padding-top: 0.5rem; padding-bottom: 0.5rem; }
    .persp, .shelter { margin-top: 0.2rem; }
    .act { min-height: 3rem; }
    #nav button { height: 3.1rem; }
    #r-shelter small { display: none; }
    #key { display: none !important; }
    .line.split { justify-content: flex-end; }
    #controls { gap: 0.3rem; bottom: 1rem; }
    #controls .mapbtn { width: 2.5rem; height: 2.5rem; font-size: 1.3rem; }
    #scale { bottom: 1rem; }
  }

  /* ================= wide screens: the card and the sheets move beside the map ================= */
  @media (min-width: 900px) {
    #screen {
      grid-template-columns: 26rem minmax(0, 1fr);
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      grid-template-areas: "bar bar" "sheet map" "side map" "nav map";
    }
    #sheet, #screen.panelled #sheet { margin-top: 0; border-radius: 0; box-shadow: none; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    #screen.panelled .insight { display: block; }
    .panel { grid-area: side; align-self: stretch; max-height: none; border-radius: 0; box-shadow: none; border-right: 1px solid var(--line); animation: none; }
    #nav { border-right: 1px solid var(--line); }
    #controls, #scale, #confirm { bottom: var(--s2); }
    #screen.panelled #confirm, #screen.panelled #hint { display: flex; }
    #top { right: auto; width: min(26rem, calc(100% - 1rem)); }
  }
</style>

    <button id="tool-area" aria-pressed="false"><svg class="i" aria-hidden="true"><use href="#i-area"/></svg><span data-t="area"></span></button>
    <button id="tool-reports" aria-pressed="false"><svg class="i" aria-hidden="true"><use href="#i-reports"/></svg><span data-t="reports"></span><span class="badge" id="nav-count" hidden></span></button>
    <button id="tool-source" aria-pressed="false"><svg class="i" aria-hidden="true"><use href="#i-source"/></svg><span data-t="source"></span></button>
    <button id="tool-packs" aria-pressed="false"><svg class="i" aria-hidden="true"><use href="#i-download"/></svg><span data-t="packs"></span></button>
  </nav>

  <section id="gate">
    <div class="gate-inner" id="gate-packs">
      <svg class="gate-logo" aria-hidden="true"><use href="#logo"/></svg>
      <p class="gate-word"><b>INGITO</b><span lang="bn">ইঙ্গিত</span></p>
      <h1 data-t="gateTitle"></h1>
      <p class="sub" data-t="gateSub"></p>
      <div class="card" id="gate-card"><div class="row"><span data-t="looking"></span></div></div>
      <div id="progress"></div>
      <label class="file"><span data-t="openFile"></span>
        <input type="file" id="pack-file" accept=".json,application/json">
      </label>
    </div>
    <!-- The map's label: every time a pack opens, what it is - before anyone relies on it. -->
    <div class="gate-inner" id="label" hidden>
      <h1 id="label-title"></h1>
      <p class="sub" data-t="labelSub"></p>
      <div class="card">
        <dl class="meta" id="label-rows"></dl>
        <button class="btn wide primary" id="label-open" data-t="openMap"></button>
      </div>
    </div>
  </section>
</div>

     Missing locally, which is harmless - the instrument then downloads or imports a pack file. -->
