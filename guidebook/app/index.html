<title>Guidebook Field Client</title>
<style>
:root {
  color-scheme: dark;
  --ground: #0a0d0f;
  --panel: #12171a;
  --panel-2: #181f23;
  --ink: #e6edf0;
  --muted: #8c9aa1;
  --rule: #222b31;
  --data: #4cc9e6;
  --warn: #e3a33c;
  --ok: #63c98a;
  --sans: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, "DejaVu Sans Mono", monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 15px/1.45 var(--sans); overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--data); outline-offset: 2px; }

#shell { display: grid; grid-template-rows: auto 1fr auto; height: 100%; }

/* ---------- status bar: the instrument's own state ---------- */
#bar { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--rule); background: var(--panel); flex-wrap: wrap; }
#bar .name { font: 600 13px/1 var(--mono); letter-spacing: 0.14em; text-transform: uppercase; }
#bar .spacer { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border: 1px solid var(--rule); border-radius: 3px; font: 500 11px/1.5 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.pill b { color: var(--ink); font-weight: 500; }
.pill.on { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, var(--rule)); }
.pill.off { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, var(--rule)); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

/* ---------- mode switch ---------- */
#modes { display: flex; gap: 2px; background: var(--ground); border: 1px solid var(--rule); border-radius: 3px; overflow: hidden; }
#modes button { padding: 5px 12px; font: 500 11px/1.5 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
#modes button[aria-pressed="true"] { background: var(--panel-2); color: var(--ink); }

/* ---------- map ---------- */
#stage { position: relative; overflow: hidden; background: #050708; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#map.dragging { cursor: grabbing; }
#scalebar { position: absolute; left: 14px; bottom: 14px; font: 500 10px/1 var(--mono); color: var(--muted); letter-spacing: 0.08em; }
#scalebar div { height: 4px; border: 1px solid var(--muted); border-top: 0; margin-top: 4px; }
#crosshair { position: absolute; right: 14px; bottom: 14px; font: 500 10px/1.6 var(--mono); color: var(--muted); text-align: right; letter-spacing: 0.05em; }

/* ---------- panels ---------- */
#side { position: absolute; top: 12px; right: 12px; width: min(330px, calc(100% - 24px)); display: flex; flex-direction: column; gap: 10px; max-height: calc(100% - 24px); overflow-y: auto; }
.card { background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--rule); border-radius: 4px; padding: 12px; backdrop-filter: blur(6px); }
.card h2 { margin: 0 0 8px; font: 500 11px/1.4 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.card h3 { margin: 10px 0 4px; font: 600 13px/1.3 var(--sans); }
.layers { display: flex; flex-direction: column; gap: 6px; }
.layer { display: flex; align-items: center; gap: 9px; padding: 7px 9px; border: 1px solid var(--rule); border-radius: 3px; background: var(--ground); text-align: left; width: 100%; }
.layer[aria-pressed="true"] { border-color: color-mix(in srgb, var(--data) 45%, var(--rule)); }
.layer .swatch { width: 12px; height: 12px; border-radius: 2px; flex: none; }
.layer .label { flex: 1; font-size: 13px; }
.layer .state { font: 500 10px/1.4 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.layer[disabled] { opacity: 0.55; cursor: not-allowed; }
.layer[disabled] .state { color: var(--warn); }
dl.meta { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 12.5px; }
dl.meta dt { color: var(--muted); }
dl.meta dd { margin: 0; }
.note { font-size: 12.5px; color: var(--muted); margin: 8px 0 0; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ---------- first run ---------- */
#gate { position: absolute; inset: 0; display: grid; place-items: center; padding: 20px; background: radial-gradient(120% 90% at 50% 0%, #10171b, #050708); overflow-y: auto; }
#gate .inner { width: min(520px, 100%); }
#gate h1 { font: 600 clamp(1.5rem, 4.5vw, 2.1rem)/1.15 var(--sans); margin: 0 0 6px; letter-spacing: -0.01em; }
#gate p.lede { color: var(--muted); margin: 0 0 20px; }
.region { border: 1px solid var(--rule); border-radius: 5px; background: var(--panel); padding: 14px; }
.region .title { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.region .title strong { font-size: 15px; }
ul.contents { list-style: none; margin: 12px 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 5px 12px; font-size: 13px; }
ul.contents li { display: flex; gap: 7px; align-items: baseline; }
ul.contents .tick { color: var(--ok); font-family: var(--mono); }
ul.contents .pend { color: var(--warn); font-family: var(--mono); }
button.go { width: 100%; padding: 11px; border: 1px solid var(--data); border-radius: 4px; background: color-mix(in srgb, var(--data) 14%, transparent); color: var(--ink); font: 500 12px/1.4 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; }
button.go:hover { background: color-mix(in srgb, var(--data) 22%, transparent); }
button.go[disabled] { opacity: 0.6; cursor: progress; }
#progress { margin-top: 10px; font: 500 11px/1.6 var(--mono); color: var(--muted); letter-spacing: 0.05em; min-height: 1.6em; }

/* ---------- footer ---------- */
#foot { display: flex; gap: 14px; align-items: center; padding: 8px 14px; border-top: 1px solid var(--rule); background: var(--panel); font: 500 10.5px/1.5 var(--mono); color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; flex-wrap: wrap; }
#foot .spacer { flex: 1; }

@media (max-width: 620px) {
  #side { position: static; width: auto; max-height: 42vh; margin: 10px; }
  #shell { grid-template-rows: auto 1fr auto auto; }
  ul.contents { grid-template-columns: 1fr; }
}
</style>

<div id="shell">
  <header id="bar">
    <span class="name">Guidebook</span>
    <div id="modes" role="group" aria-label="Mode">
      <button id="mode-field" aria-pressed="true">Field</button>
      <button id="mode-earth" aria-pressed="false">Earth</button>
    </div>
    <span class="spacer"></span>
    <span class="pill" id="pill-net"><i class="dot"></i><span>network</span></span>
    <span class="pill" id="pill-pack"><span>pack</span></span>
    <span class="pill" id="pill-fix"><span>no fix</span></span>
  </header>

  <main id="stage">
    <canvas id="map"></canvas>
    <div id="scalebar" hidden><span></span><div></div></div>
    <div id="crosshair" hidden></div>
    <div id="side" hidden></div>

    <section id="gate">
      <div class="inner">
        <h1>Where are you operating?</h1>
        <p class="lede">Download the region before you lose connectivity. Everything in the pack keeps working with no network.</p>
        <div class="region">
          <div class="title"><strong id="r-name">South Chattogram flood region</strong><span class="pill" id="r-size">—</span></div>
          <dl class="meta" id="r-meta"></dl>
          <ul class="contents" id="r-contents"></ul>
          <button class="go" id="download">Download region intelligence</button>
          <div id="progress"></div>
        </div>
      </div>
    </section>
  </main>

  <footer id="foot">
    <span id="f-pack">no pack loaded</span>
    <span class="spacer"></span>
    <span id="f-source">—</span>
    <span id="f-sw">service worker: checking</span>
  </footer>
</div>

<script src="pack-embed.js"></script>
<script src="app.js"></script>
