<title>Shakti Map</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500;600;700&family=Hind+Siliguri:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
:root{--surface:#f6f8f7;--ink:#15201d;--muted:#4a5a55;--rule:#cfd9d5;--sun:#c9730a;--wind:#008c9e;--battery:#4b55c9;--biogas:#4f8a1c;--critical:#c4302b;--card:#fff;--focus:#15201d;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--surface:#121816;--ink:#e4ebe8;--muted:#a2b2ac;--rule:#26332f;--sun:#cc7b12;--wind:#1f9fa4;--battery:#7c86ee;--biogas:#5a9a27;--critical:#e5534b;--card:#18211e;--focus:#e4ebe8;color-scheme:dark}}
:root[data-theme="dark"]{--surface:#121816;--ink:#e4ebe8;--muted:#a2b2ac;--rule:#26332f;--sun:#cc7b12;--wind:#1f9fa4;--battery:#7c86ee;--biogas:#5a9a27;--critical:#e5534b;--card:#18211e;--focus:#e4ebe8;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--surface);color:var(--ink);font:17px/1.45 'Hind Siliguri',sans-serif}button,input,select{font:inherit;color:inherit}button,select,input{border:1px solid var(--rule);background:var(--card);border-radius:5px;padding:.42rem .55rem}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--focus);outline-offset:2px}.page{max-width:1180px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--rule);padding-bottom:14px}.wordmark{font:700 clamp(2rem,6vw,4rem)/1 'Anek Bangla',sans-serif}.thesis{color:var(--muted);margin:4px 0}.live{font-family:'IBM Plex Mono',monospace;font-size:.83rem;align-self:center}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-top:16px}.card{grid-column:span 6;background:var(--card);border:1px solid var(--rule);padding:15px;border-radius:8px;min-width:0}.wide{grid-column:span 12}h2,h3{font:600 1.25rem 'Anek Bangla',sans-serif;margin:0 0 8px}small,.muted{color:var(--muted)}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.map{width:100%;height:auto;max-height:60vh;aspect-ratio:688.6/976;border:1px solid var(--rule);background:var(--surface)}.district{fill:var(--rule);stroke:var(--muted);stroke-width:2;cursor:pointer}.district.selected{fill:var(--muted);stroke:var(--ink);stroke-width:4}.pin{fill:var(--critical);stroke:var(--card);stroke-width:2}.choices{display:flex;gap:6px;flex-wrap:wrap}.choices button.active{background:var(--ink);color:var(--surface)}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{padding:5px;border-bottom:1px solid var(--rule);text-align:left}td input{width:64px;padding:.2rem}.chart{height:160px;display:flex;align-items:end;gap:3px;border-bottom:1px solid var(--rule);padding:10px 3px 0}.bar{flex:1;min-width:10px;background:var(--sun);position:relative;cursor:help}.bar.low{outline:3px solid var(--ink)}.labelrow{display:flex;gap:3px;font:10px 'IBM Plex Mono',monospace}.labelrow span{flex:1;text-align:center;overflow:hidden}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.fact{border-top:3px solid var(--rule);padding-top:4px;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}.fact strong{display:block;font-size:1.12rem}.chip{display:inline-block;padding:2px 7px;border-radius:20px;background:var(--rule);font:13px 'IBM Plex Mono',monospace}.chip.marginal{border:2px solid var(--wind)}.chip.promising{border:2px solid var(--biogas)}.chip.not-worth-it{border:2px solid var(--critical)}.legend{font:12px 'IBM Plex Mono',monospace}.legend i{display:inline-block;width:10px;height:10px;margin:0 3px}.linechart{height:145px;width:100%;border-bottom:1px solid var(--rule)}.shortfall{color:var(--critical);font-weight:600}.detail{min-height:1.5em;font-family:'IBM Plex Mono',monospace;font-size:.8rem}.honesty li{margin:.35rem 0}footer{border-top:1px solid var(--rule);margin-top:20px;padding:14px 0;color:var(--muted)}@media(max-width:700px){.card{grid-column:span 12}.page{padding:12px}.top{align-items:flex-start}.facts{grid-template-columns:repeat(2,1fr)}table{font-size:.8rem}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
<main class="page" id="app"></main>
